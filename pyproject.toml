[project]
name = "google-ads-mcp"
version = "0.1.0"
description = "A write-capable MCP server for managing Google Ads accounts through the official Google Ads API."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-ads>=30.1.0",
    "mcp>=1.23.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[project.scripts]
google-ads-mcp = "google_ads_mcp.mcp_server:main"
google-ads-mcp-cli = "google_ads_mcp.cli:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
